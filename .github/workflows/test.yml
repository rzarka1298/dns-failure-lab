name: test
on:
  push:
  pull_request:
  workflow_call:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -v ./...
        env:
          LAB_REQUIRE_NETWORK_TEST: "1"
      - run: go build ./cmd/lab
      - run: python3 -m unittest scripts/test_benchmark.py -v
      - run: for file in scripts/experiment.sh deploy/*.sh; do sh -n "$file" || exit 1; done
      - run: docker compose config
  local_e2e:
    needs: go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Start three-service lab
        run: docker compose up --build --detach --wait
      - name: Live smoke and benchmark
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dns-lab-e2e"
          curl --fail --silent --show-error http://127.0.0.1:8080/healthz > "$RUNNER_TEMP/dns-lab-e2e/health.json"
          curl --fail --silent --show-error http://127.0.0.1:8080/api/state > "$RUNNER_TEMP/dns-lab-e2e/initial-state.json"
          curl --fail --silent --show-error -X POST http://127.0.0.1:8080/api/scenario -H 'Content-Type: application/json' -d '{"scenario":"healthy"}' > /dev/null
          curl --fail --silent --show-error -X POST http://127.0.0.1:8080/api/probe -H 'Content-Type: application/json' -d '{}' > "$RUNNER_TEMP/dns-lab-e2e/smoke-probe.json"
          python3 - "$RUNNER_TEMP/dns-lab-e2e/smoke-probe.json" <<'PY'
          import json, sys
          event = json.load(open(sys.argv[1], encoding="utf-8"))
          assert event["outcome"] == "ok", event
          assert [span["name"] for span in event["spans"]] == ["dns.resolve", "http.upstream"], event
          PY
          python3 scripts/benchmark.py run --url http://127.0.0.1:8080 --samples 4 --concurrency 2 --output "$RUNNER_TEMP/dns-lab-e2e/benchmark-run.json"
          python3 scripts/benchmark.py report "$RUNNER_TEMP/dns-lab-e2e/benchmark-run.json" --output "$RUNNER_TEMP/dns-lab-e2e/benchmark-report.json"
          python3 - "$RUNNER_TEMP/dns-lab-e2e/benchmark-report.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1], encoding="utf-8"))
          matrix = report["confusion_matrix"]
          assert report["excluded_client_errors"] == 0, report
          assert matrix["true_positive"] > 0 and matrix["true_negative"] > 0, report
          assert matrix["false_positive"] == 0 and matrix["false_negative"] == 0, report
          assert report["diagnosis"]["accuracy"] == 1, report
          assert report["diagnosis"]["citation_coverage"] == 1, report
          assert report["detection_time_ms"]["measured_stages"] == 5, report
          assert report["recovery_time_ms"]["measured_stages"] == 1, report
          assert report["impact"] == "Synthetic probes only; real-user impact was not measured.", report
          PY
      - name: Capture container logs
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dns-lab-e2e"
          docker compose logs --no-color > "$RUNNER_TEMP/dns-lab-e2e/compose.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-e2e-evidence
          path: ${{ runner.temp }}/dns-lab-e2e/
          if-no-files-found: ignore
      - name: Stop lab
        if: always()
        run: docker compose down --volumes
