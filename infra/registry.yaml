AWSTemplateFormatVersion: '2010-09-09'
Description: DNS failure lab immutable container registry for one environment
Parameters:
  Stage:
    Type: String
    AllowedValues: [preview, production]
Resources:
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub dns-failure-lab-${Stage}
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep 30 release images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}'
Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
